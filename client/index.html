<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <title>NearCart+FoodDisk | Food · Grocery · More</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body>
    <div id="root">
      <style>
        .nc-premount-loader {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          background: #0f172a;
          color: #f8fafc;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
          z-index: 9999;
        }
        .nc-premount-logo {
          width: 60px;
          height: 60px;
          border-radius: 14px;
          object-fit: cover;
          box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
          animation: ncPulse 1.8s ease-in-out infinite;
        }
        .nc-premount-brand {
          margin-top: 14px;
          font-size: 1.25rem;
          font-weight: 700;
          letter-spacing: -0.02em;
          background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }
        .nc-premount-dots {
          display: flex;
          gap: 6px;
          margin-top: 18px;
        }
        .nc-premount-dots span {
          width: 7px;
          height: 7px;
          border-radius: 50%;
          background: #6366f1;
          animation: ncDot 1.4s ease-in-out infinite;
        }
        .nc-premount-dots span:nth-child(2) { animation-delay: 0.2s; }
        .nc-premount-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes ncPulse {
          0%, 100% { transform: scale(1); opacity: 1; }
          50% { transform: scale(1.06); opacity: 0.9; }
        }
        @keyframes ncDot {
          0%, 80%, 100% { transform: scale(0.6); opacity: 0.35; }
          40% { transform: scale(1.2); opacity: 1; background: #ec4899; }
        }
      </style>
      <div class="nc-premount-loader" role="status" aria-live="polite">
        <img src="/newLogo.jpeg" alt="NearCart" class="nc-premount-logo" onerror="this.style.display='none'" />
        <div class="nc-premount-brand">NearCart+FoodDisk</div>
        <div class="nc-premount-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
